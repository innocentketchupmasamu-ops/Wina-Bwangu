<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wina Bwangu - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">Wina Bwangu</div>
    <h1>Sign in</h1>
    <p class="login-subtitle">Access the Wina Bwangu application.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Log in</button>
      <p id="login-message" class="form-message"></p>
    </form>
    <p class="login-note">Don't have an account? <a href="signup.html">Create an account</a></p>
  </main>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
